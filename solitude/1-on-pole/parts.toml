  [2145, 1950], [2160, 1800], [2170, 1650], [2175, 1500], [2165, 1445], [2120, 1435],
  [2080, 1565], [2040, 1610], [1955, 1610], [1940, 1540], [1945, 1420], [1970, 1320],
