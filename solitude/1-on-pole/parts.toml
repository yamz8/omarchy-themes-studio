# The judgment in this folder: what the layers of the picture are and where each one is.
# cut.py turns it into one picture per layer, in out/parts/.

still = "solitude/1-on-pole.webp"
sha256 = "09c685ceed958826924f258a3f19d63c1e546b85200e725f0f7b478b458eee71"

# Layers are listed back to front. Every number is in pixels of the still (3160 x 2281).
#
# A layer is either a band across the whole picture (`top`, and optionally `bottom`, as the y where
# it starts and ends), whose edges fade over `fade` pixels, or a shape, as below.
#
# A layer that is not a band is a shape: a `mask` picture (white is the part), an `outline`
# polygon, or both, with `add` polygons joined on and the whole grown by `grow` pixels. Its edge
# fades outwards over `fade` pixels. `under` takes in a further outline only where the layer named
# in `by` covers it.

[[part]]
name = "sky"
note = "Stars and the swirling clouds. Opaque and full size: everything else sits on it."

[[part]]
name = "horizon"
top = 1520
bottom = 2040
fade = 80
note = "The bright band of cloud along the horizon, under the dark sky."

[[part]]
name = "ground"
top = 2030
fade = 40
note = "The snowy rocks along the bottom edge."

[[part]]
name = "climber"
# The outline is a cut-out made by an AI background remover (Higgsfield, 2026-11-28) on the still,
# kept as a 1-bit picture, cleaned to its one large piece. It follows the jacket, harness and legs to
# within a pixel or two, but took the dark cap, the shadowed left side of his head and most of the
# left glove for sky, and the sky in the gaps between his arms and his body for him. Those are put
# right by hand below. Grown 3 px so the soft edge falls on sky, not on him.
#
# Sky and his dark clothes are the very same ink (#212A2E), so colour cannot tell them apart. The
# drawing does: ink outlines and folds are him, cloud texture and stars are sky. A flat dark area
# given to the wrong layer does not show when it moves; texture and stars do.
mask = "masks/climber-ai.png"
grow = 3
fade = 3
add = [
  # the cap and the dark neck under it, down to the jacket
  [[2388, 500], [2392, 464], [2405, 441], [2433, 428], [2467, 427], [2496, 439], [2516, 460],
   [2527, 486], [2532, 516], [2537, 538], [2550, 556], [2480, 562], [2420, 562], [2378, 548],
   [2384, 525]],
  # the left glove and its cuff, along the glove's ink outline: it hangs over the light horizon
  # cloud, so any slack here carries cloud with him
  [[2009, 1375], [2090, 1406], [2112, 1440], [2115, 1480], [2105, 1505], [2085, 1512],
   [2064, 1505], [2046, 1512], [2043, 1545], [2036, 1570], [2020, 1580], [1995, 1581],
   [1980, 1577], [1973, 1568], [1972, 1540], [1978, 1505], [1986, 1474], [2000, 1430], [2005, 1406]],
  # the shadowed left side of his head and hood: a dark, smooth band between the cap and the
  # textured cloud, whose edge follows the head. Out to where the cloud texture starts, short of
  # the cloud flecks at its lower left.
  [[2412, 431], [2384, 441], [2356, 460], [2338, 490], [2334, 520], [2338, 548], [2332, 574],
   [2345, 592], [2400, 560], [2425, 500]],
  # (a patch beside his right hip, x 2612-2706 y 1424-1518, was once added here as his thigh; it lies
  # outside the harness leg loop that marks the thigh's edge and runs on from the sky in the right
  # gap, so it is sky, as the AI had it.)
]
# Sky the cut-out took for him: the gaps between his arms and his body. Cloud texture and stars
# show through both.
remove = [
  # left: the patch of cloud between the sleeve and the jacket
  [[2225, 1121], [2260, 1120], [2270, 1146], [2266, 1178], [2259, 1201], [2246, 1211],
   [2203, 1213], [2208, 1185], [2216, 1155]],
  # left: the dark sky with stars between the forearm and the hip
  [[2156, 1248], [2210, 1222], [2214, 1250], [2218, 1300], [2220, 1350], [2216, 1390],
   [2205, 1435], [2150, 1440], [2150, 1335], [2153, 1300]],
  # left: the light cloud between the glove's fingers and its cuff, which the cut-out took for him
  [[2045, 1512], [2062, 1510], [2075, 1518], [2080, 1600], [2040, 1600], [2041, 1572], [2044, 1545]],
  # right: the dark sky with specks between the arm and the harness, down to the dome
  [[2697, 1131], [2706, 1131], [2716, 1168], [2728, 1240], [2738, 1290], [2744, 1330],
   [2738, 1360], [2740, 1390], [2745, 1420], [2706, 1432], [2700, 1395], [2690, 1320],
   [2652, 1300], [2652, 1192], [2686, 1168]],
]
# Under the dome his legs are hidden, so the cut-out stops at the dome's edge. There the layer takes
# in this rough outline instead, so moving the dome never shows a gap where his legs should be. The
# picture has nothing of them there, so they are the trousers' flat ink, not a fill of the picture.
under = { by = "dome", colour = "#212A2E", outline = [
  [2150, 1650], [2350, 1560], [2560, 1490], [2625, 1470], [2640, 1500], [2600, 1600], [2520, 1800],
  [2420, 2000], [2340, 2281], [2110, 2281], [2130, 2100], [2145, 1900],
] }
note = "The climber, seen from behind, from his cap down; under the dome, his legs carry on."

[[part]]
name = "dome"
# Drawn by eye on gridded close-ups, a few pixels outside the dome's edge, and raised over the
# wires that run along its top, so they move with it.
fade = 4
outline = [
  [3160, 1120], [3080, 1185], [3000, 1240], [2920, 1293], [2850, 1333], [2780, 1373], [2700, 1438],
  [2620, 1508], [2558, 1565], [2448, 1680], [2346, 1792], [2246, 1922], [2146, 2042], [2056, 2172],
  [1982, 2281], [3160, 2281],
]
note = "The curved, roped dome in the front right, with the wires along its top."
