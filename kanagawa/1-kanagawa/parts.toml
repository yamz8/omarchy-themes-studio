# The judgment in this folder: what the parts of the picture are and roughly where each one is.
# open.py turns it into exact cut-outs by snapping these rough regions to the print's own colour areas.

still = "kanagawa/1-kanagawa.jpg"
sha256 = "9b817d717688539f0db87603b661992839c3cbb5d4918a02a4efc05c9f88b27d"

# The regions were drawn by eye on a copy of the still this wide.
drawn_at_width = 1600

# How far a part's edge reaches into the parts behind it, and how far the picture is painted in
# under the parts in front of it. Both in pixels at drawn_at_width; a part can set its own.
edge = 1
reach = 60

# Parts are listed back to front. A later region wins where two overlap.
# `rule = "rest"` takes everything no region claims. `within` picks areas of one ink (numbered
# lightest first, so 1 is bare paper) and a size range (in pixels at drawn_at_width) out of another part.

[[part]]
name = "sky"
reach = "all"
behind = "graded"
regions = [[[0, 0], [1600, 0], [1600, 452], [1560, 500], [1480, 604], [1400, 684], [1320, 750], [1180, 830], [1010, 845], [940, 812], [880, 800], [800, 800], [750, 765], [700, 710], [660, 650], [635, 580], [630, 500], [650, 430], [690, 400], [740, 400], [800, 430], [850, 470], [900, 490], [930, 430], [950, 380], [920, 330], [860, 290], [800, 265], [790, 215], [740, 170], [660, 125], [600, 112], [500, 125], [420, 150], [340, 195], [270, 250], [200, 330], [135, 390], [0, 392]]]
